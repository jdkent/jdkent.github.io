# Panels on the landing page's turntable, in display order. Each shows its
# newest item (or, for About, the bio's opening) and zooms into the full list.
# `collection` names the Jekyll collection the panel lists; `dated`
# collections show a year beside each item; `url` is where the panel's "See
# more" leads without JavaScript; `icon` is a Font Awesome solid icon name.

- key: about
  title: About
  icon: user
  url: "#bio"

- key: projects
  title: Projects
  icon: code
  collection: portfolio
  noun: project
  nouns: projects
  url: /portfolio/

- key: publications
  title: Publications
  icon: file-lines
  collection: publications
  noun: paper
  nouns: papers
  url: /publications/
  dated: true

- key: talks
  title: Talks
  icon: microphone-lines
  collection: talks
  noun: talk
  nouns: talks
  url: /talks/
  dated: true

- key: teaching
  title: Teaching
  icon: chalkboard-user
  collection: teaching
  noun: workshop
  nouns: workshops
  url: /teaching/
  dated: true

- key: writing
  title: Writing
  icon: pen-nib
  collection: posts
  noun: post
  nouns: posts
  url: /year-archive/
  dated: true

- key: cv
  title: CV
  icon: id-card
  url: /cv/
  pdf: /files/James-Kent-CV.pdf
