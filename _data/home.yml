# Category panels on the landing page, in display order.
# `collection` names the Jekyll collection the panel lists; `limit` caps how
# many of its newest items the panel previews before linking to `url`;
# `dated` collections show a year beside each item; `icon` is a Font Awesome
# solid icon name.

- key: projects
  title: Projects
  icon: code
  collection: portfolio
  noun: project
  nouns: projects
  url: /portfolio/

- key: publications
  title: Publications
  icon: file-lines
  collection: publications
  noun: paper
  nouns: papers
  url: /publications/
  dated: true
  limit: 6

- key: talks
  title: Talks
  icon: microphone-lines
  collection: talks
  noun: talk
  nouns: talks
  url: /talks/
  dated: true
  limit: 6

- key: teaching
  title: Teaching
  icon: chalkboard-user
  collection: teaching
  noun: workshop
  nouns: workshops
  url: /teaching/
  dated: true
  limit: 6

- key: writing
  title: Writing
  icon: pen-nib
  collection: posts
  noun: post
  nouns: posts
  url: /year-archive/
  dated: true
  limit: 6

- key: cv
  title: CV
  icon: id-card
  url: /cv/
  pdf: /files/James-Kent-CV.pdf
