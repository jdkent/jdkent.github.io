<!-- MathJax and Mermaid, fetched only by pages that use them: math delimiters
     in the text (outside code), or a mermaid code block. -->
<script type="module">
  const walk = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
    acceptNode: (node) => (node.parentElement.closest("pre, code, script, style") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT),
  });
  let math = false;
  while (!math && walk.nextNode()) math = /\\\(|\\\[|\$\$/.test(walk.currentNode.data);
  if (math) {
    document.head.append(Object.assign(document.createElement("script"), { id: "MathJax-script", async: true, src: "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" }));
  }

  if (document.querySelector("code.language-mermaid")) {
    const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs");
    mermaid.initialize({ startOnLoad: true, theme: "default" });
    await mermaid.run({ querySelector: "code.language-mermaid" });
  }
</script>
